<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="finresolveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="shieldGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Hexagonal Shield -->
  <polygon
    points="50,6 88,26 88,68 50,94 12,68 12,26"
    fill="rgba(18, 18, 30, 0.9)"
    stroke="url(#finresolveGrad)"
    stroke-width="4"
    filter="url(#glowEffect)"
  />

  <!-- Inner Geometric Mesh Lines -->
  <polygon
    points="50,16 78,32 78,64 50,84 22,64 22,32"
    fill="none"
    stroke="url(#shieldGlow)"
    stroke-width="1.5"
    stroke-dasharray="3 3"
    opacity="0.6"
  />

  <!-- Stylized FR Interlocking Monogram & Node Pulse -->
  <!-- "F" Bar -->
  <path
    d="M34 32 L66 32 M34 32 L34 68 M34 48 L56 48"
    stroke="#ffffff"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- "R" Dynamic Loop & Resolution Shield Node -->
  <path
    d="M56 32 C65 32 68 38 68 44 C68 48 64 52 56 52 L68 68"
    stroke="url(#finresolveGrad)"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Core Settlement Node Pulse -->
  <circle cx="50" cy="50" r="3.5" fill="#22c55e" filter="url(#glowEffect)" />
</svg>
